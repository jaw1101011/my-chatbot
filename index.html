<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 챗봇</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #1f1f1f;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    aside {
      width: 260px;
      padding: 12px;
      background: #f7f7f8;
      border-right: 1px solid #e5e5e5;
    }

    #new-chat {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    .chat {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
    }

    header {
      padding: 18px 24px;
      font-weight: bold;
      border-bottom: 1px solid #eeeeee;
    }

    #message-list {
      flex: 1;
      overflow-y: auto;
      padding: 28px max(24px, calc((100% - 760px) / 2));
    }

    .message {
      max-width: 760px;
      margin: 0 auto 18px;
      padding: 14px 16px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .bot {
      background: #f7f7f8;
      border-radius: 10px;
    }

    .user {
      margin-left: auto;
      border-radius: 10px;
      background: #e9eefc;
    }

    form {
      display: flex;
      gap: 10px;
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button[type="submit"] {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #1f1f1f;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      aside {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside>
      <button id="new-chat">+ 새 대화</button>
    </aside>

    <section class="chat">
      <header>나만의 AI 챗봇</header>

      <main id="message-list">
        <div class="message bot">안녕하세요. 무엇을 도와드릴까요?</div>
      </main>

      <form id="chat-form">
        <input id="user-input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
        <button type="submit">전송</button>
      </form>
    </section>
  </div>

  <script>
<script>
  const API_URL = "https://my-chatbot-api.jawseanjaw0816.workers.dev/";

  const form = document.querySelector("#chat-form");
  const input = document.querySelector("#user-input");
  const messageList = document.querySelector("#message-list");
  const newChatButton = document.querySelector("#new-chat");

  function addMessage(text, role) {
    const message = document.createElement("div");
    message.className = `message ${role}`;
    message.textContent = text;
    messageList.appendChild(message);
    messageList.scrollTop = messageList.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI 요청에 실패했습니다.");
      }

      addMessage(data.reply, "bot");
    } catch (error) {
      addMessage(`오류: ${error.message}`, "bot");
    }
  });

  newChatButton.addEventListener("click", () => {
    messageList.innerHTML = "";
    addMessage("안녕하세요. 무엇을 도와드릴까요?", "bot");
  });
</script>
  </script>
</body>
</html>
